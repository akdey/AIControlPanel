[project]
name = "ai-control-panel-api"
version = "1.0.0"
description = "Enterprise Agent Governance Control Plane API"
readme = "ARCHITECTURE_AND_WALKTHROUGH.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pyjwt>=2.8.0",
    "sqlalchemy>=2.0.28",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "detoxify>=0.5.2",
    "tiktoken>=0.14.0",
    "llmlingua>=0.2.2",
    "spacy>=3.8.15",
    "jinja2>=3.1.6",
    "redis>=5.0.0",
    "tldextract>=5.3.2",
    "detect-secrets>=1.5.0",
    "cryptography>=48.0.1",
    "simpleeval>=1.0.7",
    "sentence-transformers>=6.0.0",
    "transformers>=5.15.1",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "AgentControlFunctions", "adaptive_layer", "modules", "utils", "middlewares"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
